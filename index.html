<!DOCTYPE html>
<html>

<head>
  <title>Boss Battle Game</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .character {
      position: absolute;
      width: 60px;
      height: 60px;
    }

    .boss {
      width: 60px;
      height: 60px;
      margin-right: 20px;
      position: absolute;
    }

    .superboss {
      width: 60px;
      height: 60px;
      margin-right: 20px;
      position: absolute;
    }

    .superboss-hp {
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
    }

    .supercharacter {
      width: 60px;
      height: 60px;
      margin-right: 20px;
      position: absolute;
    }

    .supercharacter-hp {
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
    }

    .boss-hp {
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
    }

    .character-hp {
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
    }
  </style>
</head>

<body>
  <div id="bossHealth" class="boss-hp">HP: 1000</div>
  <div id="superBossHealth" class="superboss-hp">HP: 1500</div>

  <audio id="backgroundAudio" loop>
    <source src="Wii.mp3" type="audio/mp3">
    Your browser does not support the audio element.
  </audio>

  <audio id="fightingAudio">
    <source src="OOO.mp3" type="audio/mp3">
    Your browser does not support the audio element.
  </audio>

  <script src="script.js"></script>
</body>

</html>
